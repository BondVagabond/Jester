<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jester Control Room</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="side-rail">
      <div class="brand-block reveal rise-1">
        <p class="eyebrow">Jester Runtime</p>
        <h1>Control Room</h1>
        <p class="muted" id="runtimeRootText">Loading runtime root…</p>
      </div>

      <label class="search-block reveal rise-2" for="sourceSearch">
        <span class="eyebrow">Approved Sources</span>
        <input id="sourceSearch" type="search" placeholder="Filter sources">
      </label>

      <div class="source-list reveal rise-3" id="sourceList" aria-live="polite"></div>
    </aside>

    <main class="workspace">
      <header class="masthead reveal rise-1">
        <div>
          <p class="eyebrow">Data Root</p>
          <h2 id="dataRootText">Loading data root…</h2>
        </div>
        <div class="live-chip" id="taskChip">No active tasks</div>
      </header>

      <section class="summary-strip reveal rise-2" id="summaryStrip"></section>

      <section class="workspace-grid">
        <section class="source-detail reveal rise-3">
          <div class="section-head">
            <div>
              <p class="eyebrow">Selected Source</p>
              <h3 id="selectedSourceName">Choose a source</h3>
            </div>
            <div class="status-pair">
              <span class="inline-status" id="selectedSourceType">Type</span>
              <span class="inline-status subdued" id="selectedSourceEligibility">Eligibility</span>
            </div>
          </div>

          <p class="detail-copy" id="selectedSourceNotes">Select an approved source to inspect scope, rights, and available actions.</p>

          <dl class="detail-metrics" id="sourceMetrics"></dl>

          <form class="action-panel" id="actionForm">
            <div class="action-row">
              <label>
                <span>Max pages or artifacts</span>
                <input id="maxPagesInput" type="number" min="1" placeholder="Manifest default">
              </label>
              <label>
                <span>PDF page cap</span>
                <input id="pdfMaxPagesInput" type="number" min="1" placeholder="Optional">
              </label>
              <label>
                <span>OCR DPI</span>
                <input id="ocrDpiInput" type="number" min="72" value="300">
              </label>
            </div>

            <div class="toggle-row">
              <label class="toggle"><input id="dryRunInput" type="checkbox"><span>Dry run</span></label>
              <label class="toggle"><input id="candidateDiscoveryInput" type="checkbox"><span>Candidate discovery</span></label>
              <label class="toggle"><input id="ocrInput" type="checkbox"><span>OCR fallback</span></label>
            </div>

            <div class="button-row">
              <button type="button" class="primary-action" id="crawlButton">Run Crawl</button>
              <button type="button" class="secondary-action" id="discoverButton">Run Discovery</button>
            </div>
          </form>

          <div class="feedback-line" id="actionFeedback">Ready.</div>
        </section>

        <section class="runs-pane reveal rise-4">
          <div class="section-head compact">
            <div>
              <p class="eyebrow">Recent Runs</p>
              <h3>Runtime Activity</h3>
            </div>
          </div>

          <div class="run-list" id="runList" aria-live="polite"></div>
        </section>
      </section>

      <section class="event-log reveal rise-5">
        <div class="section-head compact">
          <div>
            <p class="eyebrow">Run Events</p>
            <h3 id="eventTitle">Select a run</h3>
          </div>
        </div>
        <div class="event-list" id="eventList"></div>
      </section>
    </main>
  </div>

  <script src="/assets/app.js" defer></script>
</body>
</html>
