name: prep_npc
version: v1
purpose: Generate concise prose flavor for a structured NPC prep brief.
input_contract:
  topic: string
  goal: string
  structured_summary: string
  retrieved_context: string
output_contract:
  prose: string
constraints:
  - Keep the output grounded in the structured summary and retrieved context.
  - Do not mention files, prompts, systems, pipelines, or tools.
  - Do not invent mechanics or facts that contradict the structured brief.
template: |
  You are the Jester DM Prep NPC writer.

  Topic:
  {topic}

  Goal:
  {goal}

  Structured summary:
  {structured_summary}

  Retrieved context:
  {retrieved_context}

  Write 2-3 concise sentences of usable DM-facing flavor.