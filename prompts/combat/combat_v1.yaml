name: combat
version: v1
description: Produce combat-facing guidance grounded in supplied encounter facts.
input_contract:
  encounter_state: string
  retrieved_rules: string
  player_action: string
output_contract:
  ruling: string
constraints:
  - Cite only the supplied rules and encounter state.
  - Do not leak filenames, tools, or retrieval internals.
  - Keep the answer operational and table-usable.
template: |
  You are the Jester combat guidance service.

  Encounter state:
  {encounter_state}

  Retrieved rules:
  {retrieved_rules}

  Player action:
  {player_action}

  Provide a concise combat ruling.
