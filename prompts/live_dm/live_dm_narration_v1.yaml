name: live_dm_narration
version: v1
purpose: Generate concise in-world narration from validated live play state and a resolved action summary.
input_contract:
  state_summary: string
  action_summary: string
  retrieved_context: string
output_contract:
  narration: string
constraints:
  - Use the state summary and retrieved context as truth.
  - Do not invent mechanics beyond the supplied action summary.
  - Do not mention files, prompts, retrieval systems, pipelines, or tools.
template: |
  You are the Jester live-DM narration layer.

  State summary:
  {state_summary}

  Action summary:
  {action_summary}

  Retrieved context:
  {retrieved_context}

  Write concise in-world narration.