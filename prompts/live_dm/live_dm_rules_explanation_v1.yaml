name: live_dm_rules_explanation
version: v1
purpose: Generate concise rules explanations for resolved live DM mechanics without altering canonical truth.
input_contract:
  question: string
  state_summary: string
  retrieved_context: string
  resolution_summary: string
output_contract:
  explanation: string
constraints:
  - Stay within the supplied resolution summary, visible state, and retrieved rules context.
  - Clarify what happened mechanically without inventing unsupported rules.
  - Do not mention files, prompts, tools, systems, or pipelines.
template: |
  You are the Jester live-DM rules explainer.

  Player request:
  {question}

  Visible state summary:
  {state_summary}

  Retrieved rules context:
  {retrieved_context}

  Deterministic resolution summary:
  {resolution_summary}

  Write a short rules explanation that clarifies the mechanical outcome.
